<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura de LibreMath - Diagram Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #09090b;   /* Jet black surface */
      --color-ink:     #f4f4f5;   /* Clean zinc white */
      --color-muted:   #a1a1aa;   /* Zinc muted */
      --color-accent:  #a78bfa;   /* Violet accent */
      --color-border:  #27272a;   /* Hairline border */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1100px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.5vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg {
      width: 100%;
      min-width: 960px;
      display: block;
      background: #0e0e11;
      border: 1px solid var(--color-border);
      border-radius: 8px;
    }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura de Sistema · LibreMath v1.0.0</p>
    <h1>Topología y Flujo de Ejecución Local de LibreMath</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="libremath-arch-title libremath-arch-desc">
        <title id="libremath-arch-title">Arquitectura de Sistema de LibreMath</title>
        <desc id="libremath-arch-desc">Diagrama de componentes locales mostrando el núcleo de Tauri Rust, la interfaz React y el motor simbólico de cálculo.</desc>
        
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#71717a"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#0e0e11" rx="8"/>

        <!-- ZONE 1: Capa de Presentación y Espacio de Trabajo (Frontend SPA) -->
        <rect x="40" y="40" width="270" height="460" rx="8" fill="#121216" stroke="#27272a" stroke-width="1"/>
        <rect x="52" y="44" width="165" height="14" rx="2" fill="#0e0e11"/>
        <text x="56" y="55" fill="#71717a" font-size="7.5" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CAPA 1: WORKSPACE &amp; UI</text>

        <!-- ZONE 2: Núcleo de Computación y Análisis (Calculus & Logic) -->
        <rect x="345" y="40" width="270" height="460" rx="8" fill="#121216" stroke="#27272a" stroke-width="1"/>
        <rect x="357" y="44" width="180" height="14" rx="2" fill="#0e0e11"/>
        <text x="361" y="55" fill="#71717a" font-size="7.5" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CAPA 2: COMPUTACIÓN SIMBÓLICA</text>

        <!-- ZONE 3: Persistencia y Core Nativo (Tauri Rust & Sandbox) -->
        <rect x="650" y="40" width="270" height="460" rx="8" fill="#121216" stroke="#27272a" stroke-width="1"/>
        <rect x="662" y="44" width="175" height="14" rx="2" fill="#0e0e11"/>
        <text x="666" y="55" fill="#71717a" font-size="7.5" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CAPA 3: PERSISTENCIA Y RUNTIME</text>

        <!-- ==================== ARROWS (Drawn before boxes for clean z-index) ==================== -->
        <!-- User Client -> Workspace Core (Horizontal Straight Line) -->
        <line x1="175" y1="140" x2="175" y2="180" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Workspace Core -> Settings & Theme (Vertical straight) -->
        <line x1="175" y1="260" x2="175" y2="300" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Workspace Core -> Calculus Engine (Orthogonal L-path with r=8) -->
        <path d="M 290,220 H 470-8 Q 470,220 470,220-8 V 160" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Workspace Core -> Matrix Engine (Horizontal) -->
        <line x1="290" y1="230" x2="365" y2="230" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Workspace Core -> Export Pipeline (Orthogonal Down) -->
        <path d="M 290,240 H 400-8 Q 400,240 400,248 V 390 H 365" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Calculus Solver -> KaTeX Typesetter (Down in Zone 2) -->
        <line x1="480" y1="160" x2="480" y2="300" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Calculus Solver -> Local Vault (Orthogonal to Zone 3) -->
        <path d="M 595,120 H 775-8 Q 775,120 775,128 V 180" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Workspace Core -> Local Vault Sync (Orthogonal) -->
        <path d="M 595,420 H 775-8 Q 775,420 775,348 V 260" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Local Vault -> Tauri Rust Sandbox (Down in Zone 3) -->
        <line x1="785" y1="260" x2="785" y2="320" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- ==================== NODES (Clean 4px Grid Layout, max rx=6) ==================== -->

        <!-- Node 1: Estudiante / Cliente Nativo -->
        <g id="node-student">
          <rect x="60" y="80" width="230" height="60" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
          <rect x="70" y="88" width="55" height="12" rx="2" fill="#27272a"/>
          <text x="74" y="97" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace">ENTRADA</text>
          <text x="70" y="117" fill="#ffffff" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Estudiante Universitario</text>
          <text x="70" y="130" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace">UTN FRRo • Ingeniería</text>
        </g>

        <!-- Node 2: Workspace Core (Tabs & Vault) -->
        <g id="node-workspace">
          <rect x="60" y="180" width="230" height="80" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
          <rect x="70" y="188" width="60" height="12" rx="2" fill="#27272a"/>
          <text x="74" y="197" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace">APP CORE</text>
          <text x="70" y="218" fill="#ffffff" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Workspace &amp; Obsidian Tabs</text>
          <text x="70" y="233" fill="#a1a1aa" font-size="9.5" font-family="'Geist', sans-serif">Bóveda de materias, Agenda y Ribbon</text>
          <text x="70" y="247" fill="#71717a" font-size="8.5" font-family="'Geist Mono', monospace">Acceso directo a Mis Notas &amp; Cálculo</text>
        </g>

        <!-- Node 3: Settings & Theme Engine -->
        <g id="node-settings">
          <rect x="60" y="300" width="230" height="75" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
          <rect x="70" y="308" width="68" height="12" rx="2" fill="#27272a"/>
          <text x="74" y="317" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace">PREFERENCIAS</text>
          <text x="70" y="338" fill="#ffffff" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Ajustes &amp; Saludo de Estudio</text>
          <text x="70" y="353" fill="#a1a1aa" font-size="9.5" font-family="'Geist', sans-serif">Nombre de usuario &amp; Modo Claro/Oscuro</text>
          <text x="70" y="366" fill="#71717a" font-size="8.5" font-family="'Geist Mono', monospace">Predeterminado: Dark Mode Obsidian</text>
        </g>

        <!-- Node 4: FOCAL NODE - Calculus Solver (U1 a U8) -->
        <g id="node-calculus-solver">
          <rect x="365" y="80" width="230" height="80" rx="6" fill="#2e1065" stroke="#a78bfa" stroke-width="1.5"/>
          <rect x="375" y="88" width="65" height="12" rx="2" fill="#4c1d95"/>
          <text x="379" y="97" fill="#e9d5ff" font-size="7" font-family="'Geist Mono', monospace">FOCAL • U1-U8</text>
          <text x="375" y="118" fill="#ffffff" font-size="12.5" font-family="'Geist', sans-serif" font-weight="600">Calculadora de Cálculo</text>
          <text x="375" y="133" fill="#ddd6fe" font-size="9.5" font-family="'Geist', sans-serif">Derivadas, Integrales y EDOs</text>
          <text x="375" y="147" fill="#c4b5fd" font-size="8.5" font-family="'Geist Mono', monospace">Resolución paso a paso + Explicación</text>
        </g>

        <!-- Node 5: Matrix Calculator Engine -->
        <g id="node-matrix-solver">
          <rect x="365" y="195" width="230" height="70" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
          <rect x="375" y="203" width="55" height="12" rx="2" fill="#27272a"/>
          <text x="379" y="212" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace">ÁLGEBRA</text>
          <text x="375" y="232" fill="#ffffff" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Motor de Álgebra Lineal</text>
          <text x="375" y="247" fill="#a1a1aa" font-size="9.5" font-family="'Geist', sans-serif">Gauss-Jordan, Inversas y Determinantes</text>
        </g>

        <!-- Node 6: KaTeX Mathematical Typesetter -->
        <g id="node-katex">
          <rect x="365" y="300" width="230" height="75" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
          <rect x="375" y="308" width="70" height="12" rx="2" fill="#27272a"/>
          <text x="379" y="317" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace">RENDERIZADO</text>
          <text x="375" y="338" fill="#ffffff" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Renderizador KaTeX</text>
          <text x="375" y="353" fill="#a1a1aa" font-size="9.5" font-family="'Geist', sans-serif">Tipografía matemática de alta velocidad</text>
          <text x="375" y="366" fill="#71717a" font-size="8.5" font-family="'Geist Mono', monospace">Fórmulas responsivas con scroll táctil</text>
        </g>

        <!-- Node 7: Exportador PDF & Markdown -->
        <g id="node-exporter">
          <rect x="365" y="405" width="230" height="65" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
          <rect x="375" y="413" width="60" height="12" rx="2" fill="#27272a"/>
          <text x="379" y="422" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace">SALIDA DOC</text>
          <text x="375" y="441" fill="#ffffff" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Pipeline de Exportación</text>
          <text x="375" y="456" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace">Exportar PDF limpio / Import-Export .md</text>
        </g>

        <!-- Node 8: Bóveda Local de Notas -->
        <g id="node-vault">
          <rect x="670" y="180" width="230" height="80" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
          <rect x="680" y="188" width="70" height="12" rx="2" fill="#27272a"/>
          <text x="684" y="197" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace">ALMACÉN LOCAL</text>
          <text x="680" y="218" fill="#ffffff" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Bóveda Local Persistente</text>
          <text x="680" y="233" fill="#a1a1aa" font-size="9.5" font-family="'Geist', sans-serif">Zero-Backend • Privacidad Total</text>
          <text x="680" y="247" fill="#71717a" font-size="8.5" font-family="'Geist Mono', monospace">localStorage / AppData seguro</text>
        </g>

        <!-- Node 9: Tauri v2 Core Sandbox -->
        <g id="node-tauri-core">
          <rect x="670" y="320" width="230" height="85" rx="6" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
          <rect x="680" y="328" width="75" height="12" rx="2" fill="#0369a1"/>
          <text x="684" y="337" fill="#e0f2fe" font-size="7" font-family="'Geist Mono', monospace">RUST CORE .EXE</text>
          <text x="680" y="358" fill="#ffffff" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Tauri v2 Desktop Bridge</text>
          <text x="680" y="373" fill="#38bdf8" font-size="9.5" font-family="'Geist', sans-serif">Compilación LTO • Strip binario</text>
          <text x="680" y="387" fill="#7dd3fc" font-size="8.5" font-family="'Geist Mono', monospace">Protección contra ingeniería inversa</text>
        </g>

        <!-- Bottom Legend Strip (Horizontal, non-floating, per SKILL.md §6 & §9) -->
        <g id="legend" transform="translate(40, 520)">
          <rect x="0" y="0" width="880" height="28" rx="4" fill="#121216" stroke="#27272a" stroke-width="0.8"/>
          
          <line x1="20" y1="14" x2="45" y2="14" stroke="#a78bfa" stroke-width="1.5"/>
          <circle cx="45" cy="14" r="2.5" fill="#a78bfa"/>
          <text x="55" y="17" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace">Flujo Simbólico Principal</text>

          <line x1="240" y1="14" x2="265" y2="14" stroke="#71717a" stroke-width="1.2"/>
          <circle cx="265" cy="14" r="2.5" fill="#71717a"/>
          <text x="275" y="17" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace">Enlace de UI / Persistencia</text>

          <line x1="490" y1="14" x2="515" y2="14" stroke="#38bdf8" stroke-width="1.2"/>
          <circle cx="515" cy="14" r="2.5" fill="#38bdf8"/>
          <text x="525" y="17" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace">Puente Nativo de Sistema (Tauri/Rust)</text>

          <rect x="740" y="8" width="12" height="12" rx="2" fill="#2e1065" stroke="#a78bfa" stroke-width="1"/>
          <text x="760" y="17" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace">Módulo Focal U1-U8</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
