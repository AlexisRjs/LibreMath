[package]
name = "libremath"
version = "1.0.0"
description = "LibreMath - Suite para estudiantes de ingeniería"
authors = ["Alexis Fernando Rojas"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Hardened release profile: maximum optimization, strip symbols, disable panics unwind
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

